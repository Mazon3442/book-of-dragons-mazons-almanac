plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

group = 'local.bodaddon'
version = mod_version
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gametestImplementation.extendsFrom(configurations.implementation)
configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.gametestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gametest)
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

tasks.named('check') { dependsOn tasks.named('gametestClasses') }

dependencies {
    // Book of Dragons is All Rights Reserved: jars stay local in libs/ and are never bundled.
    compileOnly files('libs/bookofdragons-1.4.2-1.21.1.jar', 'libs/faunaengine-1.3-1.21.1-neoforge.jar')
    // Optional client-side integration. Spatial GUI is another author's mod: local only, never bundled.
    compileOnly files('libs/spatial-gui-1.12.0-hotfix-1.21.1-neoforge.jar')
    runtimeOnly files('libs/bookofdragons-1.4.2-1.21.1.jar', 'libs/faunaengine-1.3-1.21.1-neoforge.jar')
    // Test-only: Mob Lassos (and what it needs) so dragons can be picked up and placed in the dev client. Never bundled.
    runtimeOnly files('libs/MobLassos-v21.1.1-1.21.1-NeoForge.jar', 'libs/puzzleslib-v21.1.66-mc1.21.1+neoforge.jar',
        'libs/ForgeConfigAPIPort-v21.1.6-1.21.1-NeoForge.jar')
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
